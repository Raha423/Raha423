name: Mirror Apira VPS packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-apira-vps.yml'
      - 'apira-vps/auth/**'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, brand and localize upstream packages
        run: |
          set -euxo pipefail
          rm -rf .mirror-work
          mkdir -p apira-vps/Tools .mirror-work
          base='https://raw.githubusercontent.com/WEVPSAPI/VMTOOL/main/Tools'
          for f in WeVPSControl.zip FileManager.zip Terminal.zip WEVPSNetwork.zip BackupCenter.zip WEVPSInstaller.zip WEVPSOpsDeck.zip ResourceSentinel.zip WEVPSApiCore.zip; do
            curl -fL --retry 3 "$base/$f" -o ".mirror-work/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, zipfile

          root = Path('.mirror-work')
          out = Path('apira-vps/Tools')
          auth_dir = Path('apira-vps/auth')
          files = ['WeVPSControl.zip','FileManager.zip','Terminal.zip','WEVPSNetwork.zip','BackupCenter.zip','WEVPSInstaller.zip','WEVPSOpsDeck.zip','ResourceSentinel.zip','WEVPSApiCore.zip']
          text_ext = {'.html','.htm','.js','.css','.md','.txt','.sh','.py','.json'}

          for zname in files:
              src = root / zname
              d = root / (zname + '.d')
              if d.exists():
                  shutil.rmtree(d)
              d.mkdir()
              with zipfile.ZipFile(src) as z:
                  z.extractall(d)

              for p in d.rglob('*'):
                  if not p.is_file() or (p.suffix.lower() not in text_ext and p.name != 'install-bro'):
                      continue
                  try:
                      s = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  t = s.replace(
                      'https://raw.githubusercontent.com/WEVPSAPI/VMTOOL/main/Notifications',
                      'https://raw.githubusercontent.com/Raha423/Raha423/main/apira-vps/Notifications',
                  )
                  t = re.sub(r'\bWeVPS\b', 'Apira VPS', t)
                  t = re.sub(r'\bWEVPS\b', 'Apira VPS', t)
                  t = re.sub(r'\bVMTool\b', 'Apira VPS', t)
                  t = re.sub(r'\bVMTOOL\b', 'Apira VPS', t)
                  t = t.replace('wevps-network-', 'apira-vps-network-')
                  if t != s:
                      p.write_text(t, encoding='utf-8')

              if zname == 'WeVPSControl.zip':
                  # Extension installs can restart the control service. The upstream UI
                  # refreshes once immediately, which can leave a stale "Not installed"
                  # card even though the extension was installed successfully. Inject a
                  # retrying status refresh and treat "already installed" as a refresh.
                  for ui_index in d.rglob('ui/index.html'):
                      u = ui_index.read_text(encoding='utf-8')
                      if 'APIRA_EXTENSION_REFRESH_PATCH' not in u:
                          marker = u.rfind('})();')
                          if marker != -1:
                              patch = r'''
            // APIRA_EXTENSION_REFRESH_PATCH
            const apiraSleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const apiraOriginalLoadTools = loadTools;
            loadTools = async function({ silent = false } = {}) {
                try {
                    const data = await fetchJson(API.tools);
                    state.tools = Array.isArray(data) ? data : (Array.isArray(data.tools) ? data.tools : []);
                    renderTools();
                    return true;
                } catch (error) {
                    // Keep the last known catalog during a short systemd/Gunicorn restart.
                    if (!silent) {
                        state.tools = [];
                        renderTools();
                        toast("Tools error", "Could not load tools from the API.", "error");
                    }
                    return false;
                }
            };
            async function apiraRefreshToolsUntilSettled(name, action, attempts = 12) {
                for (let attempt = 0; attempt < attempts; attempt += 1) {
                    try {
                        const data = await fetchJson(API.tools);
                        const tools = Array.isArray(data) ? data : (Array.isArray(data.tools) ? data.tools : []);
                        const tool = tools.find(item => String(item.name || "").toLowerCase() === String(name || "").toLowerCase());
                        const settled = action === "remove" ? !tool?.installed : Boolean(tool?.installed);
                        if (settled) {
                            state.tools = tools;
                            renderTools();
                            return true;
                        }
                    } catch (_) {
                        // Expected briefly while the control service reloads extension mounts.
                    }
                    await apiraSleep(Math.min(700 + attempt * 200, 1800));
                }
                return apiraOriginalLoadTools({ silent: true });
            }
            manageTool = async function(name, action, button) {
                button.disabled = true;
                const original = button.innerHTML;
                button.innerHTML = '<i data-lucide="loader-circle"></i>Working...';
                refreshIcons();
                try {
                    const response = await fetch(`/api/tools/${encodeURIComponent(name)}/${encodeURIComponent(action)}`, {
                        method: "POST",
                        headers: { "Accept": "application/json" }
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok || data.success === false) throw new Error(data.message || `HTTP ${response.status}`);
                    toast("Extensions", data.message || `${name} ${action} completed`, "success");
                    const refreshed = await apiraRefreshToolsUntilSettled(name, action);
                    if (!refreshed) toast("Extensions", "Operation completed; status is still reconnecting. Tap refresh once.", "warning");
                } catch (error) {
                    const message = String(error?.message || "Operation failed");
                    if (/already installed/i.test(message)) {
                        toast("Extensions", `${name} is already installed. Refreshing status...`, "success");
                        await apiraRefreshToolsUntilSettled(name, "install");
                        return;
                    }
                    toast("Extension error", message, "error");
                    button.disabled = false;
                    button.innerHTML = original;
                    refreshIcons();
                }
            };
'''
                              u = u[:marker] + patch + '\n' + u[marker:]
                              ui_index.write_text(u, encoding='utf-8')

                  for installer in d.rglob('install.sh'):
                      control = installer.parent
                      shutil.copy2(auth_dir / 'apira_auth.py', control / 'apira_auth.py')
                      shutil.copy2(auth_dir / 'apira_entry.py', control / 'apira_entry.py')

                      s = installer.read_text(encoding='utf-8')
                      s = re.sub(r'^Environment=WEVPS_BACKEND_(?:MANIFEST_URL|URL|API_URL)=.*\n?', '', s, flags=re.M)
                      s = s.replace(' vmtool:app', ' apira_entry:app')
                      s = s.replace('import vmtool; print(', 'import apira_entry; print(')

                      if 'WEVPS_EXTENSIONS_MANIFEST_URL=' not in s:
                          s = s.replace(
                              'Environment=PYTHONUNBUFFERED=1\n',
                              'Environment=PYTHONUNBUFFERED=1\n'
                              'Environment=WEVPS_EXTENSIONS_MANIFEST_URL=https://raw.githubusercontent.com/Raha423/Raha423/main/apira-vps/Extensions\n',
                          )
                      if 'APIRA_VPS_AUTH_FILE=' not in s:
                          s = s.replace(
                              'Environment=PYTHONUNBUFFERED=1\n',
                              'Environment=PYTHONUNBUFFERED=1\n'
                              'Environment=APIRA_VPS_AUTH_FILE=/etc/apira-vps/auth.json\n',
                          )

                      init_line = '"${CONTROL_DIR}/.venv/bin/python" "${CONTROL_DIR}/apira_auth.py" --init --file /etc/apira-vps/auth.json --username admin\n'
                      req_line = '"${CONTROL_DIR}/.venv/bin/python" -m pip install -r "${CONTROL_DIR}/requirements.txt"\n'
                      if 'apira_auth.py" --init' not in s:
                          s = s.replace(req_line, req_line + '\n' + init_line)

                      installer.write_text(s, encoding='utf-8')

              target = out / zname
              with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(d.rglob('*')):
                      if p.is_file():
                          z.write(p, p.relative_to(d))
          PY
      - name: Commit mirrored packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apira-vps/Tools
          if git diff --cached --quiet; then
            echo 'No package changes.'
          else
            git commit -m 'Mirror standalone Apira VPS packages'
            git push
          fi
