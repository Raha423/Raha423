name: Mirror Apira VPS packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-apira-vps.yml'
      - 'apira-vps/auth/**'
      - 'apira-vps/i18n/**'
      - 'apira-vps/patches/**'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, brand and localize upstream packages
        run: |
          set -euxo pipefail
          rm -rf .mirror-work
          mkdir -p apira-vps/Tools .mirror-work
          base='https://raw.githubusercontent.com/WEVPSAPI/VMTOOL/main/Tools'
          for f in WeVPSControl.zip FileManager.zip Terminal.zip WEVPSNetwork.zip BackupCenter.zip WEVPSInstaller.zip WEVPSOpsDeck.zip ResourceSentinel.zip WEVPSApiCore.zip; do
            curl -fL --retry 3 "$base/$f" -o ".mirror-work/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, zipfile, subprocess, sys

          root = Path('.mirror-work')
          out = Path('apira-vps/Tools')
          auth_dir = Path('apira-vps/auth')
          i18n_dir = Path('apira-vps/i18n')
          i18n_js = (i18n_dir / 'apira-i18n-v2.js').read_text(encoding='utf-8').replace('</script', '<\\/script')
          i18n_fa = (i18n_dir / 'apira-fa.json').read_text(encoding='utf-8').replace('</script', '<\\/script')
          files = ['WeVPSControl.zip','FileManager.zip','Terminal.zip','WEVPSNetwork.zip','BackupCenter.zip','WEVPSInstaller.zip','WEVPSOpsDeck.zip','ResourceSentinel.zip','WEVPSApiCore.zip']
          text_ext = {'.html','.htm','.js','.css','.md','.txt','.sh','.py','.json'}

          def inject_i18n(path: Path):
              s = path.read_text(encoding='utf-8', errors='ignore')
              s = re.sub(r'\s*<!-- APIRA_I18N_BEGIN -->.*?<!-- APIRA_I18N_END -->', '', s, flags=re.S)
              s = re.sub(r'\s*<script src="apira-i18n\.js\?v=[^"]+"></script>', '', s)
              bundle = (
                  '    <!-- APIRA_I18N_BEGIN -->\n'
                  '    <script id="apiraFaMessages">window.__APIRA_FA_MESSAGES__ = ' + i18n_fa + ';</script>\n'
                  '    <script id="apiraI18nRuntime">\n' + i18n_js + '\n    </script>\n'
                  '    <!-- APIRA_I18N_END -->'
              )
              if '</body>' in s:
                  s = s.replace('</body>', bundle + '\n</body>', 1)
              else:
                  s += '\n' + bundle + '\n'
              path.write_text(s, encoding='utf-8')

          for zname in files:
              src = root / zname
              d = root / (zname + '.d')
              if d.exists(): shutil.rmtree(d)
              d.mkdir()
              with zipfile.ZipFile(src) as z: z.extractall(d)

              for p in d.rglob('*'):
                  if not p.is_file() or (p.suffix.lower() not in text_ext and p.name != 'install-bro'): continue
                  try: s = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  t = s.replace('https://raw.githubusercontent.com/WEVPSAPI/VMTOOL/main/Notifications','https://raw.githubusercontent.com/Raha423/Raha423/main/apira-vps/Notifications')
                  t = re.sub(r'\bWeVPS\b', 'Apira VPS', t)
                  t = re.sub(r'\bWEVPS\b', 'Apira VPS', t)
                  t = re.sub(r'\bVMTool\b', 'Apira VPS', t)
                  t = re.sub(r'\bVMTOOL\b', 'Apira VPS', t)
                  t = t.replace('wevps-network-', 'apira-vps-network-')
                  if t != s: p.write_text(t, encoding='utf-8')

              for html in d.rglob('*.html'): inject_i18n(html)

              if zname == 'WeVPSControl.zip':
                  control_ui = next(d.rglob('ui/index.html'))
                  subprocess.run([sys.executable, 'apira-vps/patches/security_guides.py', str(control_ui)], check=True)
                  for installer in d.rglob('install.sh'):
                      control = installer.parent
                      shutil.copy2(auth_dir / 'apira_auth.py', control / 'apira_auth.py')
                      shutil.copy2(auth_dir / 'apira_entry.py', control / 'apira_entry.py')
                      s = installer.read_text(encoding='utf-8')
                      s = re.sub(r'^Environment=WEVPS_BACKEND_(?:MANIFEST_URL|URL|API_URL)=.*\n?', '', s, flags=re.M)
                      s = s.replace(' vmtool:app', ' apira_entry:app')
                      s = s.replace('import vmtool; print(', 'import apira_entry; print(')
                      if 'WEVPS_EXTENSIONS_MANIFEST_URL=' not in s:
                          s = s.replace('Environment=PYTHONUNBUFFERED=1\n','Environment=PYTHONUNBUFFERED=1\nEnvironment=WEVPS_EXTENSIONS_MANIFEST_URL=https://raw.githubusercontent.com/Raha423/Raha423/main/apira-vps/Extensions\n')
                      if 'APIRA_VPS_AUTH_FILE=' not in s:
                          s = s.replace('Environment=PYTHONUNBUFFERED=1\n','Environment=PYTHONUNBUFFERED=1\nEnvironment=APIRA_VPS_AUTH_FILE=/etc/apira-vps/auth.json\n')
                      init_line = '"${CONTROL_DIR}/.venv/bin/python" "${CONTROL_DIR}/apira_auth.py" --init --file /etc/apira-vps/auth.json --username admin\n'
                      req_line = '"${CONTROL_DIR}/.venv/bin/python" -m pip install -r "${CONTROL_DIR}/requirements.txt"\n'
                      if 'apira_auth.py" --init' not in s: s = s.replace(req_line, req_line + '\n' + init_line)
                      installer.write_text(s, encoding='utf-8')

              target = out / zname
              with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(d.rglob('*')):
                      if p.is_file(): z.write(p, p.relative_to(d))
          PY
      - name: Commit mirrored packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apira-vps/Tools
          if git diff --cached --quiet; then
            echo 'No package changes.'
          else
            git commit -m 'Mirror optimized bilingual Apira VPS packages'
            git push
          fi
